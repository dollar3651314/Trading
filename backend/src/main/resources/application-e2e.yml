# 端到端测试配置（S19，内部文档）。只在 Spring profile e2e 下加载：
#   SPRING_PROFILES_ACTIVE=e2e FX_E2E_ENABLED=true java -jar trading.jar
# e2e profile 会打开不需要登录的 /api/e2e/**（取验证码、注入充值、推动报价、推进提现），
# 只能用于 CI 和本机。common.e2e.E2eGuard 在启动时检查：没有 FX_E2E_ENABLED=true、带了 prod/production/staging profile、
# 配置了热钱包私钥、链节点或 SMTP 时拒绝启动。
trading:
  e2e:
    enabled: ${FX_E2E_ENABLED:false}
  # 通用限流（P-05）：端到端测试和压测（e2e/load/，同样用 e2e profile）的所有请求都来自同一个 IP，压测几十个客户集中下单，上限放大。
  # 限流本身在后端 RateLimitTest 里单独测；Nginx 那一层见 deploy/nginx/site.conf.template
  rate-limit:
    ip-per-minute: 1000000
    ws-handshake-per-minute: 1000000
    user-write-per-minute: 1000000
    admin-login-per-ip: 1000000
  # 行情：连报价服务（e2e/start-backend.sh 先启动 quote-app，模拟模式，50 个品种都有报价）；测试用 /api/e2e/market/move 推动某个品种的价格
  # （转给报价服务的 /internal/e2e/move）。内部 Key 是 start-backend.sh 里的一次性测试值
  market:
    source: remote
  # 钱包：TopUP 由 e2e 的假 TopUP 代替（payment.fake.E2ePayment，本机随机端口、随机 Key），充值地址、到账回调、提现付款都走支付接口层；
  # 不连任何真实节点和真实 TopUP
  wallet:
    chains:
      ERC20:
        usdt-contract: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
      BSC:
        usdt-contract: "0x55d398326f99059fF775485246999027B3197955"
      TRC20:
        usdt-contract: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
  # 证件照片放在临时目录
  storage:
    local-dir: ${FX_STORAGE_DIR:${java.io.tmpdir}/trading-e2e-storage}
