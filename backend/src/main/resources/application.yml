# 配置只写变量名，值由环境变量提供；密钥只由 负责人 填在服务器上（底线：密钥不经过 AI）。
trading:
  # 健康检查返回的版本：部署时镜像构建把 git 提交号写进 FX_VERSION；没有时用 Maven 的 project.version（构建时替换 @...@）
  version: '${FX_VERSION:@project.version@}'
  # 测试环境标识（S20）：测试环境设 FX_ENV_LABEL=test，生产不设。非空时健康检查返回 env 字段，页面顶部显示"测试环境"标识条，
  # 邮件和推送标题前加"[测试] / [TEST] "
  env-label: ${FX_ENV_LABEL:}
  # 测试管理员（做法 07，admin/security/TestAdmin）：只在测试环境。令牌由 Amos 用密码管理器生成，服务器上 sudo trading gen-test-admin 隐藏输入，.env 只存 SHA-256。
  # 两条都满足才认：FX_ENV_LABEL=test、报价模式 FX_QUOTE_MARKET_SOURCE=simulated（和报价服务同一个 .env）。不看 TopUP（测试服务器上两边轮流跑）。
  # 不是测试环境却配了 TEST_ADMIN_TOKEN_SHA256：拒绝启动
  test-admin:
    token-sha256: ${TEST_ADMIN_TOKEN_SHA256:}
    quote-market-source: ${FX_QUOTE_MARKET_SOURCE:}
  # 对外编号（雪花 ID，v2 第 11.4 节，common/id/Snowflake）：节点号 0–1023，单实例默认 1；以后多实例时每个实例必须不同
  id:
    node: ${FX_ID_NODE:1}
  # 监控告警（v2 E8，common/health/AlertCheck）：行情全部断流、扫块停滞、链节点连不上、邮件连续发送失败。
  # 健康检查 /api/health 的 alerts 里显示每一项（不影响 status 和 HTTP 状态码，部署脚本不会因此回滚）；异常和恢复时给告警邮箱发邮件。
  # 告警邮箱 FX_ALERT_EMAILS 逗号分隔，代码里没有默认值（默认值在部署配置 deploy/kit/docker-compose.yml），为空时只记日志
  alert:
    enabled: true
    emails: ${FX_ALERT_EMAILS:}
    # 同一项告警多长时间内不重复发邮件
    throttle: 30m
    # 开市的品种多长时间没收到任何报价算"行情全部断流"
    market-silence: 30s
    # 扫块多长时间没推进（或者落后的区块折合超过这个时间）算"停滞"
    scan-stall: 10m
    # 连续几次连不上节点算"节点不通"（扫块每 15 秒一次）
    node-failures: 3
    # 连续几封邮件发送失败算"邮件发送失败"
    mail-failures: 5
  # 登录参数，默认值沿用现有系统（内部文档 2.5–2.7）
  auth:
    login-failure-limit: 5
    lock-minutes: 15
    session-ttl-hours: 72
    code-ttl-minutes: 10
    code-resend-seconds: 60
    code-max-attempts: 5
    # 安全审查 SEC-03：同一邮箱同一用途 24 小时最多发 10 次验证码；同一 IP 每小时最多请求 30 次（大陆移动网络很多人共用一个出口 IP，留足余量）
    code-daily-limit: 10
    code-ip-hourly-limit: 30
    cookie-name: fx_session
    cookie-secure: ${FX_COOKIE_SECURE:true}
    # 第一阶段只走 Telegram（TB-33，TG 机器人第 2 批）：true = 关闭注册、邮箱登录、忘记密码（含发验证码），网页没有会话时显示"请在 Telegram 打开"提示页。
    # 默认关（第 2 批审查 🟡1）：Amos 统一验收时用 sudo trading set FX_PHASE1_TELEGRAM_ONLY true 打开
    phase1-telegram-only: ${FX_PHASE1_TELEGRAM_ONLY:false}
    # 机器人会话（从机器人一键登录）：闲置 30 分钟、最长 12 小时（技术方案 11 页第 2 节）
    bot-session-idle-minutes: 30
    bot-session-max-hours: 12
  # 通用限流（功能取舍对照表 P-05，common/ratelimit）：Redis 计数，Redis 不可用时放行。超限返回 429 RATE_LIMITED 和 Retry-After。
  # Nginx 外层还有一道更宽松的限流（deploy/nginx/site.conf.template）。上限填 0 表示这一层不限。
  # IP 是 Nginx 传来的真实客户端 IP；大陆移动网络很多人共用一个出口 IP，按 IP 的上限留足余量
  rate-limit:
    enabled: true
    key-prefix: "fx:rl:"
    # 同一 IP 每分钟最多请求 /api/** 几次（不含 /api/health 和 WebSocket 握手）
    ip-per-minute: 600
    # 同一 IP 每分钟最多几次 WebSocket 握手（行情、交易推送；只数握手，已建立的连接不受影响）
    ws-handshake-per-minute: 120
    # 同一客户每分钟最多几次交易和资金写操作（下单、改单、撤单、平仓、改止盈止损、追加保证金、提现提交、白名单增删，合计）
    user-write-per-minute: 60
    # 后台登录：同一 IP 15 分钟内最多请求 20 次（成功失败都算，安全审查 SEC-15）
    admin-login-per-ip: 20
    admin-login-window: 15m
    # Redis 出错后 30 秒内不再访问 Redis、直接放行
    redis-down-skip: 30s
  # 行情的交易侧（内部文档 第 8 节）。第 2 批拆进程：报价源、主备切换、质量守卫在报价服务 quote-app（配置见 quote-app 的 quote.yml），
  # 这里通过内部 WebSocket 收干净报价，再加点、撮合、推给客户端
  market:
    # 报价从哪来：none（默认，不连报价服务，防止生产忘了配置时用上别的价格；后端测试直接喂报价）；remote（连报价服务）
    source: ${FX_MARKET_SOURCE:none}
    # 报价时间（报价源给的时间）距今超过这个不能成交（和报价服务的质量守卫一样）
    stale-after: 5s
    # 过期保护（第 2 批）：一个品种超过这个时间没收到新报价就不成交、不开仓；到达时已经超过 stale-after 的旧报价不交给撮合（不按过期价强平）
    max-quote-age: 3s
    push-interval: 250ms
    # 报价服务（source=remote 时用）。内部 Key 只由负责人填进服务器 .env，和报价服务的 FX_QUOTE_INTERNAL_KEY 是同一个值
    quote-app:
      url: ${FX_QUOTE_APP_URL:http://127.0.0.1:8090}
      key: ${FX_QUOTE_INTERNAL_KEY:}
      reconnect-initial: 500ms
      reconnect-max: 30s
      idle-timeout: 10s
      sync-retry: 30s
      # 给报价服务发一条消息最多等多久，超时说明连接半死，断开重连
      send-timeout: 3s
    # 没有对应外汇品种的币种：港币按联系汇率（1 USD = 7.78 HKD）
    fixed-usd-rates:
      HKD: 0.12853470
    # 官网公开行情 GET /api/public/quotes（v2 需求 4.2，不需要登录）：只返回这些品种的卖价和当日涨跌幅，按这个顺序；
    # 整份结果缓存 cache-ttl，所有访客共用。改品种只改这里（需求要求 8–12 个）。
    # source：官网用哪种价格。simulated（默认）一律模拟价、显示"示例行情"；live 用交易报价（真实报价源的价格），
    # 两家数据商的条款都禁止未授权的公开展示，拿到书面展示授权以后才能改成 live（内部文档 第 6 节）
    public-quotes:
      source: ${FX_PUBLIC_QUOTES_SOURCE:simulated}
      # 生产只开加密货币（生产方案 v1 07 页 R-1）：生产 docker-compose 用 FX_PUBLIC_QUOTES_SYMBOLS 换成 10 个加密货币（逗号分隔）；
      # 停用的品种不管在不在这里都不返回（品种表只认启用的）
      symbols: ${FX_PUBLIC_QUOTES_SYMBOLS:XAUUSD,XAGUSD,EURUSD,GBPUSD,USDJPY,USDCNH,NAS100,XTIUSD,BTCUSD,ETHUSD}
      cache-ttl: 1s
  trading:
    # 单个用户的持仓上限（USD 名义价值，含挂单），沿用原型的 3,000,000；S16 改为后台可配置
    position-limit-usd: 3000000
    # 撮合引擎：行情驱动的挂单成交、止盈止损、强平（S9）
    engine-enabled: true
    engine-threads: 8
    engine-workers: 8
    # 隔夜费（S10）：每天 UTC 22:00 结算（沿用现有系统），费率在品种配置里（swap_long / swap_short，待 负责人 提供，现在都是 0）
    swap:
      enabled: true
      rollover-time: "22:00"
      catch-up-days: 3
    # 追保预警（S15a，通知方案 N4）：每 10 秒检查，保证金水平低于追保线通知一次；同一客户两次至少隔 5 分钟（沿用现有系统）
    margin-call:
      enabled: true
      line: 1.00
      min-interval: 5m
  # 风控（S11）：每 5 秒检查净敞口，超过阈值自动禁开。阈值在后台设置（S16），没有设置的不监控
  risk:
    monitor-enabled: true
    # 自动禁开时通知的风控人员邮箱，逗号分隔（负责人 提供，H7）
    alert-emails: ${FX_RISK_ALERT_EMAILS:}
  # 钱包（第 0 批过渡）：只留充值入账、提现、自动审批、对账的业务规则；地址派生、扫链、归集、热钱包已去掉，
  # 第 1 批换成支付接口层（TopUP）。仓库里只有变量名，值只由负责人填进服务器
  # 支付接口层（第 1 批）：充值地址、到账回调、提现付款都交给钱包提供方，第一版只有 TopUP（Trading 是 TopUP 的内部商户）。
  # 三个值由 Amos 填进服务器环境变量（底线 1），仓库只有变量名；没填时 TopUP 算"未接入"：充值页显示"暂时无法获取充值地址"，
  # 提现审核通过后停在"已审核待放款"（不退款），配好后自动继续。回调地址 https://<客户端域名>/api/pay/callback/topup 由 Amos 在 TopUP 后台填
  payment:
    # 每 30 秒查一次提供方余额（自动审批 R12 用）并判断接口通不通（健康检查 wallet.topup）
    monitor-enabled: true
    topup:
      base-url: ${FX_TOPUP_BASE_URL:}
      api-key: ${FX_TOPUP_API_KEY:}
      api-secret: ${FX_TOPUP_API_SECRET:}
      timeout: 10s
  # 每条链的 USDT 合约地址（自带钱包时代的三个变量）第 1 批后没有代码用，第 4 批从这里删掉（测试配置里的不动）
  wallet:
    # 最小充值 1 USDT（负责人 确认，充值方案 D4）
    min-deposit: 1
    # 提现（S13，内部文档）：限额沿用现有系统（N-08），手续费 负责人 确认（W3），从提现金额里扣
    withdraw:
      min-amount: 10
      # 单笔上限 5,000（TQ-13 = TD-15 A：TopUP 单笔只能付 5,000）
      max-per-tx: 5000
      daily-limit: 30000
      large-amount: 3000
      large-delay: 6h
      cooling: 2h
      whitelist-delay: 24h
      max-whitelist: 10
      fees:
        ERC20: 5
        TRC20: 1
        BSC: 0.5
    chains:
      ERC20:
        usdt-decimals: 6
        confirmations: 12
        block-seconds: 12
        # 主网 USDT 每个区块有上百笔转账，每次少扫一些，避免节点服务的返回条数上限
        scan-batch: 20
      BSC:
        # BSC 上的 USDT 是 18 位小数，按需求要上链实测确认（S20）
        usdt-decimals: 18
        confirmations: 15
        # BSC 出块已经缩短到约 0.45 秒（2026-10-21 在测试网和主网各取 1,000 个区块实测：450 秒），原来按 3 秒配置，
        # 每 15 秒只扫 50 个区块，几乎追不上出块，停机后积压永远补不完（scan.BSC 一直 DOWN）。
        # 每 15 秒扫 150 个区块 ≈ 10 个/秒，是出块速度（约 2.2 个/秒）的 4 倍多；主网 USDT 转账多，一次不扫太多区块
        block-seconds: 0.45
        scan-batch: 150
      TRC20:
        usdt-decimals: 6
        confirmations: 19
        block-seconds: 3
        # TRON 按区块逐个查，每个区块 2 次请求
        scan-batch: 10
  # 通知（S15a，内部文档）。邮件用 SMTP（N1），服务商待定（N-05）；没有配置 FX_MAIL_HOST 时邮件只记录、不发送。
  # 密码只由 负责人 填进服务器环境变量
  notify:
    worker-enabled: true
    mail:
      host: ${FX_MAIL_HOST:}
      port: ${FX_MAIL_PORT:587}
      username: ${FX_MAIL_USERNAME:}
      password: ${FX_MAIL_PASSWORD:}
      from: ${FX_MAIL_FROM:}
      # STARTTLS（587 端口）或 SSL（465 端口）
      security: ${FX_MAIL_SECURITY:STARTTLS}
    # Web Push（S15b，通知方案 N2）：VAPID 密钥由 负责人 在自己电脑上生成（例如 npx web-push generate-vapid-keys）后填进服务器；
    # 私钥只由 负责人 填。测试和生产各用一对，生成后不要换（换了所有客户要重新订阅）。没填时不发推送
    push:
      vapid-public-key: ${FX_PUSH_VAPID_PUBLIC_KEY:}
      vapid-private-key: ${FX_PUSH_VAPID_PRIVATE_KEY:}
      vapid-subject: ${FX_PUSH_VAPID_SUBJECT:}
      ttl: 24h
      max-devices: 10
  # Telegram 机器人（TG 机器人第 1 批，技术方案 TG机器人-05 / 11 页）。令牌只由 Amos 用 sudo trading set-key FX_TG_BOT_TOKEN 填进服务器；
  # 没填令牌 = 不启动轮询线程、不发 Telegram 提醒（开发机、CI、测试机默认都不填）。用户名用 sudo trading set FX_TG_BOT_USERNAME 改：
  # 测试 TradingAssistTestBot、生产 TradingAssistBot（应急登录机器人 TradingAssistLoginBot 是批 5 的事，这里不用）。
  # 启动时用 getMe 核对令牌属于这个用户名，不一致就不启动（防止把生产令牌填到测试机）。开户名单、总开关在后台系统配置（telegram.*）里改
  telegram:
    token: ${FX_TG_BOT_TOKEN:}
    username: ${FX_TG_BOT_USERNAME:}
    api-url: ${FX_TG_API_URL:https://api.telegram.org}
    # 网页客户端地址（login_url 按钮「打开交易」「查看」用）。批 2 做好一键登录落地页、绑好域名之前不填：不填就不显示这些按钮
    web-url: ${FX_TG_WEB_URL:}
    # 进入网页的方式（第 2 批）：login-url = login_url 按钮一键登录（默认，要先在 BotFather /setdomain 绑上网页的域名）；
    # link = 退路：回调按钮 + 机器人现发一条 60 秒、只能用一次的链接（域名绑不上时用）
    login-mode: ${FX_TG_LOGIN_MODE:login-url}
    # 第 5 批应急开关（TB-34）：另一个只管登录的机器人（网页「用 Telegram 登录」的登录小部件用它）。用户名 sudo trading set FX_TG_LOGIN_BOT_USERNAME，
    # 令牌只由 Amos 用 sudo trading set-key FX_TG_LOGIN_BOT_TOKEN 填；没填 = 应急开关打开了也不显示「用 Telegram 登录」
    login-bot:
      username: ${FX_TG_LOGIN_BOT_USERNAME:}
      token: ${FX_TG_LOGIN_BOT_TOKEN:}
    poll-timeout: 50s
    # 发送：同一个聊天两条之间至少隔多久；全部聊天每秒最多几条（Telegram 的限制是每个聊天每秒 1 条、全部每秒约 30 条）
    per-chat-interval: 1s
    global-per-second: 25
    queue-capacity: 5000
    # 轮询连续失败多久算告警（alerts.telegram）；收到 409（另一个程序在用同一个令牌）立即告警
    unhealthy-after: 10m
    # 每个 Telegram 用户每分钟最多处理几条消息 / 按钮（超过的不回应；需求文档 TG机器人-03 页）
    user-per-minute: 20
  # 后台（S16a，内部文档）。登录锁定次数和时长、IP 白名单在后台的系统配置里改
  admin:
    session-ttl: 8h
    idle-timeout: 30m
    cookie-name: fx_admin_session
    # 第 5 批应急开关（TB-34）：只有这个后台账号编号能开关（写编号、不写用户名，不靠权限点）；sudo trading set FX_ADMIN_OWNER_ID <编号>。没配 = 后台谁都不能开关
    owner-id: ${FX_ADMIN_OWNER_ID:}
    cookie-secure: ${FX_COOKIE_SECURE:true}
    # 第一个超级管理员（G1）：系统里还没有管理员时启动会用它建；密码只由 负责人 填，建好后可以删掉这两个变量
    init-username: ${FX_ADMIN_INIT_USERNAME:}
    init-password: ${FX_ADMIN_INIT_PASSWORD:}
  # 生产第一次启动时的初始化（生产方案 v1 07 页 R-1、R-5，admin.ops.ProductionInit）：各只做一次，做完记标记，以后以后台为准。
  # 只有生产的 docker-compose 设这两个变量；没设什么都不做
  init:
    # 只保留这些分类的品种（逗号分隔：fx / metal / index / energy / crypto / stock），其余停用；生产写 crypto（Amos 11/19「只开加密」）
    enabled-categories: ${FX_INIT_ENABLED_CATEGORIES:}
    # 钱包提供方可用余额告警下限（USDT，系统配置 payment.balance.minUsdt）；生产写 5000（Amos 11/19）
    balance-min-usdt: ${FX_INIT_BALANCE_MIN_USDT:}
  # 对象存储（证件照片）。现在是本地目录，正式环境在 S20 换成对象存储服务
  storage:
    local-dir: ${FX_STORAGE_DIR:./data/storage}

server:
  port: ${FX_HTTP_PORT:8080}
  # 客户端真实 IP 取自 Nginx 传来的 X-Forwarded-For，只信任内网地址的代理（登录失败按 IP 计数要用）
  forward-headers-strategy: native

spring:
  application:
    name: trading
  datasource:
    url: ${FX_DB_URL}
    username: ${FX_DB_USERNAME}
    password: ${FX_DB_PASSWORD}
    hikari:
      # 每个连接都用 UTC，数据库默认时间和 UTC_TIMESTAMP() 一致
      connection-init-sql: SET time_zone = '+00:00'
      # 撮合执行线程（8）+ 检查线程 + 接口请求共用；默认 10 不够。空闲时只保留 5 个
      maximum-pool-size: ${FX_DB_POOL_SIZE:30}
      minimum-idle: 5
  data:
    redis:
      host: ${FX_REDIS_HOST:localhost}
      port: ${FX_REDIS_PORT:6379}
      password: ${FX_REDIS_PASSWORD:}
      # Redis 只用于限次计数（登录失败、发验证码、通用限流）和健康检查；卡住时 2 秒就放弃，不让请求一直等（默认 60 秒）
      timeout: 2s
      connect-timeout: 2s
  # KYC 每张图最大 2MB（AC-05），一次提交 3 张
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 7MB
  # 表结构只通过 Flyway 迁移脚本修改（src/main/resources/db/migration），表结构说明见 内部文档
  flyway:
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 日志：级别后面带追踪号（v2 E9，common/trace/TraceId）：[32 位十六进制]（HTTP 请求和 WebSocket 连接，和响应头 X-Request-Id 相同）、
# [job-…]（定时任务每次执行一个），没有时是 [-]。按追踪号查一个请求的全部日志：grep 追踪号
logging:
  pattern:
    correlation: "[%X{traceId:--}] "
  level:
    # TelegramBots 库自己的日志可能带请求网址（网址里有机器人令牌）：关掉，轮询和发送的状态由 telegram 模块自己记（不含令牌）
    org.telegram: "OFF"

# 应用管理端点只在内网端口监听，Nginx 不转发（修复 fxsystem S3）。
# 指标（v2 E10）：GET http://127.0.0.1:8081/actuator/prometheus（Prometheus 格式）、/actuator/metrics；自定义指标都以 fx_ 开头，
# 见 内部文档 第 15 节。只在服务器本机（容器里）能访问，不对外
management:
  server:
    port: ${FX_MANAGEMENT_PORT:8081}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
