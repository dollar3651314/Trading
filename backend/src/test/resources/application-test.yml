# 测试用真实的 MySQL 和 Redis（C37）：CI 里是 GitHub 提供的服务容器，本地用 Docker 起同样的容器。
# 地址有默认值；数据库密码只从环境变量 FX_DB_PASSWORD 读取（CI 里是测试容器的一次性密码）。
spring:
  datasource:
    url: ${FX_DB_URL:jdbc:mysql://localhost:3306/trading_test}
    username: ${FX_DB_USERNAME:root}
    password: ${FX_DB_PASSWORD}
    # 测试会缓存多个 Spring 上下文，每个都有连接池；限小一些，避免超过 MySQL 默认的 151 个连接
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
management:
  server:
    port: 0
trading:
  # 测试都从 127.0.0.1 发请求、共用一个 Redis，按 IP 的发验证码限次（SEC-03）放大；限次本身在 SendCodeLimiterTest 里单独测
  auth:
    code-ip-hourly-limit: 1000000
    # 大部分测试走邮箱注册：关掉"第一阶段只走 Telegram"（生产默认开）；只走 Telegram 的行为在 TelegramWebLoginTest 里单独打开测
    phase1-telegram-only: false
  # 通用限流（P-05）：测试都从 127.0.0.1 或少数几个 IP 发请求、共用一个 Redis，上限放大；限流本身在 RateLimitTest 里用很小的上限单独测
  rate-limit:
    ip-per-minute: 1000000
    ws-handshake-per-minute: 1000000
    user-write-per-minute: 1000000
    admin-login-per-ip: 1000000
  # 第 4 批 4b：找回申请不定时推进，测试里直接调 RecoveryService 的推进方法
  account:
    recovery:
      scheduler-enabled: false
  # 测试里不连报价服务，由测试直接喂报价（跨进程测试另起报价服务，见 support/QuoteAppHarness）
  market:
    source: none
  # 撮合引擎默认关：其他测试手动平仓时不会被引擎抢先强平；撮合测试里单独打开
  trading:
    engine-enabled: false
    # 隔夜费不定时跑，测试里直接调用并指定时间
    swap:
      enabled: false
    # 追保不定时检查，测试里直接调用
    margin-call:
      enabled: false
  # 净敞口不定时检查，测试里直接调用
  risk:
    monitor-enabled: false
  # 支付接口层：不定时查提供方余额，测试里直接调用；TopUP 不配置（测试用假 TopUP，见 payment 包的测试）
  payment:
    monitor-enabled: false
  # 钱包：合约地址是三条链官方 USDT 合约的公开地址。测试用链替身，不连真实节点
  wallet:
    # 网页申请冻结提现的最短响应时间（生产 800 毫秒）：测试里调小，800 毫秒只在 WebFreezeTimingTest 里测
    freeze:
      min-response-ms: 20
    # 提现状态不定时推进，测试里直接调用
    withdraw:
      scheduler-enabled: false
    # 对账不定时跑，测试里直接调用
    recon:
      enabled: false
    chains:
      ERC20:
        usdt-contract: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
      BSC:
        usdt-contract: "0x55d398326f99059fF775485246999027B3197955"
      TRC20:
        usdt-contract: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
  # 邮件任务不定时发送，测试里直接调用；SMTP 指向测试进程里的 GreenMail（NotifyFlowTest 启动），不连外网
  notify:
    worker-enabled: false
    mail:
      host: localhost
      port: 3025
      from: noreply@trading.test
      security: NONE
    # 推送：测试用的 VAPID 私钥就是数字 1（公钥是 P-256 的基点 G），明显不是真实密钥；推送服务用本机的 HTTP 替身
    push:
      vapid-public-key: BGsX0fLhLEJH-Lzm5WOkQPJ3A32BLeszoPShOUXYmMKWT-NC4v4af5uO5-tKfA-eFivOM1drMV7Oy7ZAaDe_UfU
      vapid-private-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAE
      vapid-subject: mailto:ops@trading.test
      allow-localhost: true
  # 监控告警不定时发邮件，测试里直接调用（AlertMonitorTest）；健康检查里的 alerts 照常
  alert:
    enabled: false
  storage:
    local-dir: ${java.io.tmpdir}/trading-test-storage
