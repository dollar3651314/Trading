# 生产（.env 的 TR_ENV=production）叠加在 docker-compose.yml 上面，由 trading 命令自动加上（-f docker-compose.yml -f docker-compose.production.yml）。
# 生产方案 v1（Amos 11/19 批）：和 TopUP 生产共用 Amos 的虚拟机（4 核 8G、16G 盘、没有公网 IP），平台网关（InstaBox）做 HTTPS，
# 每个发布的端口一个 https://<端口>-<编号>.instabox.tech 地址。和测试环境不一样的地方都在这里，测试环境的 docker-compose.yml 不动：
#   - trading-web：只映射 8082 客户端、8083 后台、8084 官网、8085 报价对外（默认只绑 127.0.0.1，平台上先不发布；要发布时 TR_QUOTE_BIND=0.0.0.0），
#     不占 80、443，不挂证书；Nginx 用平台网关模式的模板（deploy/nginx/gateway.conf.template）
#   - trading-app 的健康检查口改成 127.0.0.1:18080（原来的 8080 和同机 TopUP 生产的 0.0.0.0:8080 冲突）
#   - 不设 FX_ENV_LABEL（页面没有"测试环境"条，测试管理员一律不认）；报价 live、只开币安现货；开发者文档 auto（live 下不给看）；官网可以被收录
#   - 第一次启动时只开加密货币（FX_INIT_ENABLED_CATEGORIES=crypto）、余额告警下限 5,000（FX_INIT_BALANCE_MIN_USDT），各只做一次（Amos 11/19）
#   - 内存、CPU（生产方案 03 页，C75：上限不小于各部分之和、合计低于可用内存、不用交换分区）：
#       trading-app 1,024（堆 512 + 元空间 160 + 代码缓存 64 + 直接内存 64 = 800，线程和本机内存约 150，余量约 70）、2 核
#       quote-app 512（堆 160 + 元空间 112 + 代码缓存 40 + 直接内存 16 = 328，JVM 之外约 70，余量约 110）、1 核
#       mysql 768（缓冲池 384、连接 40、临时表 64、performance_schema 关、不写二进制日志）、1 核
#       redis 64（maxmemory 32mb，写满报错不淘汰）、web 64，各 0.5 核
#     合计 2,432 MB（TopUP 生产 2,368 + 这里 2,432 + 系统和 Docker 约 600 ≈ 5.4 GB < 8 GB）。CPU 上限按 03 页逐项写（2 + 1 + 1 + 0.5 + 0.5 = 5；
#     03 页一图里写的"合计 ≤ 4.5 核"和逐项加起来对不上，这里按逐项，两个 JVM 按 2 核算）；
#     启动门槛 2,600 MB、内存守护 300 MB（trading 命令按 TR_ENV 取默认值）。数都能在 .env 改（TR_MEM_*、TR_HEAP_* 等，名字和测试环境一样，默认值不同）
#   - Docker 日志每个容器 20 MB × 3（磁盘紧，生产方案 03 页）
# 这台机器上同时跑着 TopUP 生产：Trading 从不停它、不改它（trading 命令里不调 topup stop / start）。
services:
  trading-web:
    ports: !override
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
      - "${TR_QUOTE_BIND:-127.0.0.1}:8085:8085"
    volumes: !reset []
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates-gateway
      TR_NGINX_MODE: gateway
      # 只管官网 8084（客户端、后台、报价写死不收录）
      FX_NGINX_NOINDEX: "false"
      # 真实 IP（默认关；实测平台网关后 sudo trading set TR_REAL_IP_FROM / TR_REAL_IP_HEADER，两项都填才开）
      TR_REAL_IP_FROM: ${TR_REAL_IP_FROM:-}
      TR_REAL_IP_HEADER: ${TR_REAL_IP_HEADER:-off}
    mem_limit: ${TR_MEM_WEB:-64m}
    memswap_limit: ${TR_MEM_WEB:-64m}
    cpus: 0.5
    logging: &prod-logging
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  trading-app:
    ports: !override
      - "127.0.0.1:18080:8080"
    environment:
      # 不是测试环境：没有"测试环境"条，测试管理员不认（配了 TEST_ADMIN_TOKEN_SHA256 应用拒绝启动，trading 命令也拒绝）
      FX_ENV_LABEL: ""
      TEST_ADMIN_TOKEN_SHA256: ""
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx${TR_HEAP_APP:-512m} -XX:MaxMetaspaceSize=${TR_META_APP:-160m} -XX:ReservedCodeCacheSize=${TR_CODE_APP:-64m} -XX:MaxDirectMemorySize=${TR_DIRECT_APP:-64m} -Xss512k -XX:ActiveProcessorCount=2 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -XX:TrimNativeHeapInterval=5000
      # MySQL 最多 40 个连接：trading 24 + quote 6 + 备份 1 + 健康检查 1 + 余量
      FX_DB_POOL_SIZE: ${TR_DB_POOL_APP:-24}
      FX_QUOTE_MARKET_SOURCE: live
      # 官网公开行情：live 模式下只列品种名和"登录后查看实时行情"（TD-9 A）；只列 10 个加密货币（只开加密，R-1）
      FX_PUBLIC_QUOTES_SOURCE: simulated
      FX_PUBLIC_QUOTES_SYMBOLS: BTCUSD,ETHUSD,SOLUSD,XRPUSD,BNBUSD,DOGEUSD,ADAUSD,LTCUSD,DOTUSD,BCHUSD
      # 第一次启动时各只做一次（admin/ops/ProductionInit），之后以后台为准
      FX_INIT_ENABLED_CATEGORIES: crypto
      FX_INIT_BALANCE_MIN_USDT: "5000"
    mem_limit: ${TR_MEM_APP:-1024m}
    memswap_limit: ${TR_MEM_APP:-1024m}
    cpus: 2
    logging: *prod-logging

  quote-app:
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx${TR_HEAP_QUOTE:-160m} -XX:MaxMetaspaceSize=${TR_META_QUOTE:-112m} -XX:ReservedCodeCacheSize=${TR_CODE_QUOTE:-40m} -XX:MaxDirectMemorySize=${TR_DIRECT_QUOTE:-16m} -Xss256k -XX:ActiveProcessorCount=2 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -XX:TrimNativeHeapInterval=5000
      FX_QUOTE_DB_POOL_SIZE: ${TR_DB_POOL_QUOTE:-6}
      # 生产：只用真实报价源（只开币安现货，只读行情、不要 Key）；AllTick、iTick 没合同不填
      FX_QUOTE_MARKET_SOURCE: live
      FX_QUOTE_BINANCE_ENABLED: "true"
      FX_QUOTE_BINANCE_FUTURES_ENABLED: "false"
      FX_QUOTE_LICENSE_ENFORCE: "false"
      # live 模式下 /docs/ 不给看（测试环境写死 true）
      FX_QUOTE_OPEN_DOCS: auto
    mem_limit: ${TR_MEM_QUOTE:-512m}
    memswap_limit: ${TR_MEM_QUOTE:-512m}
    cpus: 1
    logging: *prod-logging

  mysql:
    command: !override
      - --innodb-buffer-pool-size=${TR_MYSQL_BUFFER_POOL:-384M}
      - --performance-schema=OFF
      # 连接数：trading-app 连接池 24 + quote-app 6 + 备份导出 1 + 健康检查 1 + 余量
      - --max-connections=40
      - --innodb-log-buffer-size=8M
      - --key-buffer-size=1M
      - --table-open-cache=512
      - --table-open-cache-instances=1
      - --table-definition-cache=400
      - --thread-cache-size=8
      - --temptable-max-ram=64M
      - --skip-name-resolve
      - --host-cache-size=0
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
      # 不写二进制日志（单机、没有从库，备份用 mysqldump；8.4 默认开、留 30 天，16G 的盘放不下，生产方案 03 页）
      - --disable-log-bin
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    mem_limit: ${TR_MEM_MYSQL:-768m}
    memswap_limit: ${TR_MEM_MYSQL:-768m}
    cpus: 1
    logging: *prod-logging

  redis:
    command: !override ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 32mb --maxmemory-policy noeviction --save 300 10"]
    mem_limit: ${TR_MEM_REDIS:-64m}
    memswap_limit: ${TR_MEM_REDIS:-64m}
    cpus: 0.5
    logging: *prod-logging
