# 和 TopUP 共机（TR_MODE=shared，Amos 11/17 定测试环境用现有那台 2 核 2G）：叠加在 docker-compose.yml 上，由 trading 命令自动加上。
#   - trading-web 不映射 80、443（TopUP 的 Nginx 占着）。TopUP 的 Nginx 按域名把 Trading 的四个子域名转给 https://trading-web:443
#     （它那边要加的一段配置见 shared/topup-nginx-trading.conf.example，由 TopUP 那边评审后加，本工具包不改 TopUP 的任何文件）
#   - 真实 IP：trading-web 只信任从 TopUP 网络来的 X-Real-IP（state/nginx/realip.conf，trading setup 按 TopUP 网络的网段生成）
#   - Redis：用 TopUP 的 Redis（主机名 redis，在 TopUP 的网络里），db 编号 TR_REDIS_DB（默认 2；TopUP 用 0），键有自己的前缀
#   - 接到 TopUP 网络上的只有 trading-web、trading-app、quote-app 三个（名字和 TopUP 的不重复）；mysql 不接。TopUP 的容器、配置、数据都不动
services:
  trading-web:
    ports: !reset []
    networks:
      shared: {}
  trading-app:
    networks:
      shared: {}
  quote-app:
    networks:
      shared: {}

networks:
  shared:
    external: true
    name: ${TR_SHARED_NETWORK:-topup_default}
