# quote-app（报价进程）配置。文件名是 quote.yml（spring.config.name=quote），不读 application.yml。
# 密钥（内部 Key、报价源 token、数据库密码）只从环境变量来，仓库里只有变量名。
server:
  port: ${FX_QUOTE_HTTP_PORT:8090}
  # 只监听内网：默认 127.0.0.1（和 trading-app 在同一台机器）；第 4 批部署时改成内网地址（FX_QUOTE_BIND_ADDRESS），不对公网开放
  address: ${FX_QUOTE_BIND_ADDRESS:127.0.0.1}

spring:
  application:
    name: quote
  datasource:
    url: ${FX_QUOTE_DB_URL}
    username: ${FX_QUOTE_DB_USERNAME}
    password: ${FX_QUOTE_DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
      maximum-pool-size: ${FX_QUOTE_DB_POOL_SIZE:5}
      minimum-idle: 1
  # 第 3 批：报价对外的限额计数、防重放、WebSocket 票据（键前缀 fxq:）。默认和 trading-app 同一个 Redis；连不上时对外接口返回 503，内部接口不受影响
  data:
    redis:
      host: ${FX_QUOTE_REDIS_HOST:${FX_REDIS_HOST:localhost}}
      port: ${FX_QUOTE_REDIS_PORT:${FX_REDIS_PORT:6379}}
      password: ${FX_QUOTE_REDIS_PASSWORD:${FX_REDIS_PASSWORD:}}
      # db 编号（第 4 批）：默认和 trading-app 同一个；和 TopUP 共用一台 Redis 时用单独的编号
      database: ${FX_QUOTE_REDIS_DATABASE:${FX_REDIS_DATABASE:0}}
      timeout: 2s
      connect-timeout: 2s
  # 报价进程自己的表（quote_symbol、quote_session、quote_holiday、quote_source_license），和 trading-app 的库分开
  flyway:
    locations: classpath:db/quote

logging:
  pattern:
    correlation: "[%X{traceId:--}] "

# 管理端点只在本机端口（不对外）
management:
  server:
    port: ${FX_QUOTE_MANAGEMENT_PORT:8091}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: quote

quote:
  # 报价（拆分前是 trading-app 的 trading.market）。质量守卫阈值沿用（功能地图 M-05、M-06）
  market:
    # 报价模式：none（默认，不启动报价源）；simulated（开发、测试环境：配了 token 的真实报价源接管它覆盖的品种，其余模拟）；live（生产：只用真实报价源）
    source: ${FX_QUOTE_MARKET_SOURCE:none}
    simulated-interval: 500ms
    stale-after: 5s
    unchanged-max-age: 1m
    max-spread-rate: 0.05
    max-tick-jump-rate: 0.10
    max-volatility-rate: 0.05
    volatility-window: 60s
    # K 线保留条数（v2 第 11.2 节，quote-app 的 kline/KlineRetention，第 2 批第二步从 trading-app 搬来）：每个品种每个周期只保留最近 N 根，每天 UTC 20:10 分批清理一次
    kline-retention:
      enabled: true
      cron: "0 10 20 * * *"
      batch-size: 5000
      keep:
        1m: 10080
        5m: 8640
        15m: 8640
        1h: 8760
        4h: 4380
        1d: 3650
  # 内部 WebSocket /internal/ws/quotes（协议见 quote-protocol 模块）
  stream:
    # 内部 Key：只由负责人填进服务器 .env（FX_QUOTE_INTERNAL_KEY），trading-app 配同一个值；为空时拒绝所有连接
    internal-key: ${FX_QUOTE_INTERNAL_KEY:}
    heartbeat: 1s
    # 每个品种在内存里留最近多少条，用来给断线重连的客户端补齐（补不上发快照）
    replay-buffer: 512
    send-time-limit: 5s
    send-buffer-limit: 4194304
  # 报价对外（第 3 批，需求 03 页）：外部客户和 Key、限额、计量（只计量不收费）、对外 REST /v1/** 和 WebSocket /v1/ws、开发者文档 /docs/。
  # 对外开放总开关不在配置里：只能在后台由超管打开（存在库里，默认关）。
  open:
    # 加密保存 Secret 的密钥：只由负责人填进服务器 .env（FX_QUOTE_KEY_ENC_KEY）；为空时不能建 Key、外部请求一律 401
    key-enc-key: ${FX_QUOTE_KEY_ENC_KEY:}
    timestamp-skew: 300s
    ticket-ttl: 5m
    usage-flush: 60s
    retention-months: 13
    sweep: 1s
    # 签名里的 nonce 记多久（防重放；要不短于时间戳允许的偏差 × 2）
    nonce-ttl: 600s
    # WebSocket 连接名额的租约：连接期间每 ws-renew 续一次，断开立即释放；进程崩溃没释放的最多占这么久
    ws-lease: 60s
    ws-renew: 20s
    # 开发者文档：auto = 只用模拟源时能看（报价模式 live 或配了任何真实报价源都不给看）
    docs: ${FX_QUOTE_OPEN_DOCS:auto}
  # 报价源授权登记（技术方案 08 页，TQ-11 A）：auto = 报价模式 live（生产）时只用"交易用途"已授权的源开仓、外部 Key 只拿转售已授权的品种；测试环境不受限制。
  # 报价模式 live，或者配了任何真实报价源（在用真实数据）时一律检查：FX_QUOTE_LICENSE_ENFORCE=false 只在只用模拟源时有效
  license:
    enforce: ${FX_QUOTE_LICENSE_ENFORCE:auto}
    reload-interval: 60s
  # 真实报价源（内部文档）：外汇、指数、贵金属、原油、美股 AllTick 主、iTick 备；10 个加密货币币安现货主、AllTick 备（第 12 节）。
  # AllTick、iTick 的 token 只由 负责人 填进服务器 .env，空 = 不用这家；币安不要 token，用开关 FX_QUOTE_BINANCE_ENABLED（默认关闭）。
  # 都没配时和接入以前完全一样（simulated 模式下全部模拟）。只要报价，不抛单
  feeds:
    # AllTick、iTick 谁在前：alltick 或 itick（填 itick 时这两家在所有品种里对调；币安的位置不受影响）
    primary: ${FX_QUOTE_PRIMARY:alltick}
    # 主源一个品种多久没报价切备源；主源恢复多久后切回
    failover-after: ${FX_QUOTE_FAILOVER_AFTER:10s}
    failback-after: ${FX_QUOTE_FAILBACK_AFTER:30s}
    # 两家中间价偏差超过这个比例（0.005 = 0.5%）→ 这个品种暂停开仓并告警（平仓、止盈止损、强平照常，用主源价格）；两家的报价都在 cross-check-max-age 以内才比较
    max-deviation: ${FX_QUOTE_MAX_DEVIATION:0.005}
    cross-check-max-age: 5s
    # USDT 计价的映射（代码以 USDT 结尾）乘的系数：负责人 2026-10-17 确认 USDT 按 1:1 当 USD
    usdt-usd-rate: ${FX_QUOTE_USDT_USD_RATE:1}
    # 开市时一家报价源多久没给任何报价算告警（quote.alltick / quote.itick / quote.binance）
    silence-alert: 60s
    # 断线重连：1 秒起每次翻倍，最长 60 秒；一条连接 60 秒没有任何消息就断开重连
    reconnect-initial: 1s
    reconnect-max: 60s
    idle-timeout: 60s
    alltick:
      token: ${FX_QUOTE_ALLTICK_TOKEN:}
      fx-url: ${FX_QUOTE_ALLTICK_FX_URL:wss://quote.alltick.co/quote-b-ws-api}
      stock-url: ${FX_QUOTE_ALLTICK_STOCK_URL:wss://quote.alltick.co/quote-stock-b-ws-api}
      heartbeat: 10s
      channel-gap: 3s
    itick:
      token: ${FX_QUOTE_ITICK_TOKEN:}
      url: ${FX_QUOTE_ITICK_URL:wss://api.itick.org}
      heartbeat: 20s
    # 币安公开行情（第 12 节）：不需要 API Key。默认关闭（不改变现有行为，也避开条款风险：币安公开数据是非商业许可），负责人 决定后在 .env 打开。
    # 现货地址是只读行情专用域名（美国服务器也能连）。永续（futures）代码保留但默认关闭：负责人 2026-10-17 决定不用币安永续给贵金属、原油、美股报价，
    # 映射里没有任何品种用它
    binance:
      enabled: ${FX_QUOTE_BINANCE_ENABLED:false}
      spot-url: ${FX_QUOTE_BINANCE_SPOT_WS_URL:wss://data-stream.binance.vision}
      futures-enabled: ${FX_QUOTE_BINANCE_FUTURES_ENABLED:false}
      futures-url: ${FX_QUOTE_BINANCE_FUTURES_WS_URL:wss://fstream.binance.com/public}
      # 每 30 秒发一次 LIST_SUBSCRIPTIONS 确认连接活着（现货每条连接每秒最多 5 条客户端消息）
      heartbeat: 30s
      # 一条连接最多几个流（官方上限 1024），超过分多条连接
      max-streams-per-connection: 200
      # 官方：一条连接只保持 24 小时。23 小时主动换新连接
      max-connection-age: 23h
    # 品种 → [主源, 备源, 第三候补]，每项 "报价源:连接:代码"。AllTick 连接 fx / stock；iTick 连接 forex / indices / crypto / stock（代码写成 代码$地区）。
    # 币安连接 spot / futures（代码大写，例如 BTCUSDT）。只用最前面两个能用的源：加密货币在币安开关关闭时就是以前的"AllTick 主、iTick 备"，
    # 打开后是"币安主、AllTick 备"（iTick 不订阅，AllTick 没 token 时 iTick 补上当备源）。
    # 代码依据和标【推断】的项见技术方案第 2 节，拿到 token 后要核对。没写的品种（例如后台新增的）只走模拟源
    routes:
      EURUSD: ["alltick:fx:EURUSD", "itick:forex:EURUSD$GB"]
      GBPUSD: ["alltick:fx:GBPUSD", "itick:forex:GBPUSD$GB"]
      USDJPY: ["alltick:fx:USDJPY", "itick:forex:USDJPY$GB"]
      USDCHF: ["alltick:fx:USDCHF", "itick:forex:USDCHF$GB"]
      USDCAD: ["alltick:fx:USDCAD", "itick:forex:USDCAD$GB"]
      AUDUSD: ["alltick:fx:AUDUSD", "itick:forex:AUDUSD$GB"]
      NZDUSD: ["alltick:fx:NZDUSD", "itick:forex:NZDUSD$GB"]
      EURGBP: ["alltick:fx:EURGBP", "itick:forex:EURGBP$GB"]
      EURJPY: ["alltick:fx:EURJPY", "itick:forex:EURJPY$GB"]
      GBPJPY: ["alltick:fx:GBPJPY", "itick:forex:GBPJPY$GB"]
      EURCHF: ["alltick:fx:EURCHF", "itick:forex:EURCHF$GB"]
      EURAUD: ["alltick:fx:EURAUD", "itick:forex:EURAUD$GB"]
      EURCAD: ["alltick:fx:EURCAD", "itick:forex:EURCAD$GB"]
      AUDJPY: ["alltick:fx:AUDJPY", "itick:forex:AUDJPY$GB"]
      CADJPY: ["alltick:fx:CADJPY", "itick:forex:CADJPY$GB"]
      CHFJPY: ["alltick:fx:CHFJPY", "itick:forex:CHFJPY$GB"]
      AUDCAD: ["alltick:fx:AUDCAD", "itick:forex:AUDCAD$GB"]
      AUDNZD: ["alltick:fx:AUDNZD", "itick:forex:AUDNZD$GB"]
      GBPAUD: ["alltick:fx:GBPAUD", "itick:forex:GBPAUD$GB"]
      GBPCHF: ["alltick:fx:GBPCHF", "itick:forex:GBPCHF$GB"]
      USDCNH: ["alltick:fx:USDCNH", "itick:forex:USDCNH$GB"]
      XAUUSD: ["alltick:fx:GOLD", "itick:forex:XAUUSD$GB"]
      XAGUSD: ["alltick:fx:Silver", "itick:forex:XAGUSD$GB"]
      XTIUSD: ["alltick:fx:USOIL", "itick:forex:XTIUSD$GB"]
      XBRUSD: ["alltick:fx:UKOIL", "itick:forex:XBRUSD$GB"]
      US30: ["alltick:fx:US30", "itick:indices:US30USD$GB"]
